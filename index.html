<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocketMoney</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --primary: #ff2a5f;
            --primary-gradient: linear-gradient(135deg, #ff2a5f, #ff7e40);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --squircle-radius: 36px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .total-spent {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Locket Image Area */
        .locket-card {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--card-bg);
            border-radius: var(--squircle-radius);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 2px dashed #333;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .locket-card:active {
            transform: scale(0.97);
        }
        .locket-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .locket-placeholder svg {
            width: 48px;
            height: 48px;
            fill: var(--text-muted);
        }
        #photo-input {
            display: none;
        }

        /* Amount & Quick Add */
        .amount-display {
            font-size: 42px;
            font-weight: 800;
            text-align: center;
            margin: 10px 0;
            transition: all 0.2s ease;
        }
        .quick-add {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-chip {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-chip:active {
            background-color: #333;
            transform: scale(0.95);
        }

        /* Categories */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background-color: transparent;
            border: 2px solid #333;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .cat-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background-color: rgba(255, 42, 95, 0.1);
        }

        /* Submit Button */
        .submit-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 42, 95, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(255, 42, 95, 0.2);
        }

        /* History List */
        .history-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
        }
        .history-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .history-thumb {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-color: #333;
        }
        .history-cat {
            font-size: 16px;
            font-weight: 600;
        }
        .history-amount {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LocketMoney</h1>
        <div class="total-spent" id="total-text">Hôm nay: 0 đ</div>
    </div>

    <!-- Vùng up ảnh kiểu Locket -->
    <div class="locket-card" id="image-box" onclick="document.getElementById('photo-input').click()">
        <div class="locket-placeholder" id="placeholder">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h1.5l1.2-1.5h2.6l1.2 1.5H16c1.1 0 2 .9 2 2v5c0 1.1-.9 2-2 2z" opacity=".3"/><path d="M4 12c0 4.41 3.59 8 8 8s8-3.59 8-8-3.59-8-8-8-8 3.59-8 8zm12.5 4H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h1.5l1.2-1.5h2.6l1.2 1.5H16c1.1 0 2 .9 2 2v5c0 1.1-.9 2-2 2zM12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span style="font-weight: 600;">Chạm để chụp ảnh</span>
        </div>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="environment">

    <!-- Hiển thị số tiền -->
    <div class="amount-display" id="amount-display">0 đ</div>

    <!-- Phím bấm nhanh -->
    <div class="quick-add">
        <button class="btn-chip" onclick="addMoney(15000)">+15k</button>
        <button class="btn-chip" onclick="addMoney(35000)">+35k</button>
        <button class="btn-chip" onclick="addMoney(50000)">+50k</button>
        <button class="btn-chip" onclick="resetMoney()" style="background-color: #333;">Xóa</button>
    </div>

    <!-- Danh mục -->
    <div class="categories" id="category-list">
        <button class="cat-btn active" onclick="selectCat(this, 'Cà phê')">☕ Cà phê</button>
        <button class="cat-btn" onclick="selectCat(this, 'Bánh mì')">🥖 Bánh mì</button>
        <button class="cat-btn" onclick="selectCat(this, 'Phở/Bún')">🍜 Phở/Bún</button>
        <button class="cat-btn" onclick="selectCat(this, 'Ăn vặt')">🍟 Ăn vặt</button>
    </div>

    <!-- Nút Ghi nhận -->
    <button class="submit-btn" onclick="submitRecord()">Ghi nhận ngay 🚀</button>

    <!-- Danh sách Lịch sử -->
    <div class="history-list" id="history-box"></div>
</div>

<script>
    let currentAmount = 0;
    let selectedCat = 'Cà phê';
    let currentImage = '';
    let totalToday = 0;

    // Định dạng tiền tệ VNĐ
    function formatMoney(num) {
        return num.toLocaleString('vi-VN') + ' đ';
    }

    // Xử lý up ảnh
    document.getElementById('photo-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImage = event.target.result;
                const box = document.getElementById('image-box');
                box.style.backgroundImage = `url(${currentImage})`;
                box.style.border = 'none';
                document.getElementById('placeholder').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    });

    // Thêm tiền nhanh
    function addMoney(amount) {
        currentAmount += amount;
        document.getElementById('amount-display').innerText = formatMoney(currentAmount);
        playPopSound();
    }

    // Reset tiền
    function resetMoney() {
        currentAmount = 0;
        document.getElementById('amount-display').innerText = formatMoney(currentAmount);
    }

    // Chọn danh mục
    function selectCat(element, catName) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedCat = catName;
    }

    // Tạo âm thanh Pop mượt mà bằng Web Audio API
    function playPopSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } catch (e) {
            console.log("Audio not supported");
        }
    }

    // Xử lý khi bấm nút "Ghi nhận ngay"
    function submitRecord() {
        if (currentAmount === 0) {
            alert("Vui lòng nhập số tiền!");
            return;
        }

        // Cập nhật tổng
        totalToday += currentAmount;
        document.getElementById('total-text').innerText = 'Hôm nay: ' + formatMoney(totalToday);

        // Hiệu ứng pháo hoa Confetti
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ff2a5f', '#ff7e40', '#ffffff']
        });
        playPopSound();

        // Thêm vào lịch sử
        const historyBox = document.getElementById('history-box');
        const item = document.createElement('div');
        item.className = 'history-item';
        
        const imgStyle = currentImage ? `background-image: url(${currentImage});` : '';
        
        item.innerHTML = `
            <div class="history-info">
                <div class="history-thumb" style="${imgStyle}"></div>
                <div class="history-cat">${selectedCat}</div>
            </div>
            <div class="history-amount">-${formatMoney(currentAmount)}</div>
        `;
        historyBox.prepend(item);

        // Reset form
        resetMoney();
        currentImage = '';
        const box = document.getElementById('image-box');
        box.style.backgroundImage = 'none';
        box.style.border = '2px dashed #333';
        document.getElementById('placeholder').style.display = 'flex';
    }
</script>
</body>
</html>
