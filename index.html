<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LocketMoney - Visual Diary</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #1a1a1a;
            --surface-light: #2c2c2e;
            --text: #ffffff;
            --text-dim: #8e8e93;
            --accent: #ffb703;
            --radius-huge: 44px;
            --radius-pill: 30px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }

        /* --- SCREEN CHÍNH (CAMERA / FEED) --- */
        .main-screen { flex: 1; display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); position: relative; z-index: 10; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .main-screen.slide-left { transform: translateX(-100vw); }

        /* Top Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-light); background-image: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'); background-size: cover; border: 1px solid #333; }
        .balance-pill { background-color: var(--surface); padding: 8px 16px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .balance-pill::after { content: '⌄'; position: relative; top: -2px; color: var(--text-dim); }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }

        /* Big Squircle Photo */
        .photo-container { flex: 1; width: 100%; max-height: 60vh; border-radius: var(--radius-huge); background-color: var(--surface); position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background-size: cover; background-position: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .photo-placeholder { color: var(--text-dim); font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        
        .photo-overlay-text { position: absolute; bottom: 30px; left: 20px; right: 20px; text-align: center; font-size: 18px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 2; }
        .photo-user-tag { position: absolute; bottom: -40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
        .photo-user-tag img { width: 20px; height: 20px; border-radius: 50%; }

        /* Input Bar (Send message style) */
        .input-bar-container { margin-top: 30px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .input-bar { background-color: var(--surface); border-radius: var(--radius-pill); padding: 4px 6px 4px 20px; display: flex; justify-content: space-between; align-items: center; height: 52px; border: 1px solid transparent; transition: border 0.2s; }
        .input-bar:focus-within { border-color: var(--surface-light); }
        .input-field { background: transparent; border: none; color: white; font-size: 16px; font-weight: 500; width: 100%; outline: none; }
        .input-field::placeholder { color: #666; font-weight: 500; }
        .quick-emojis { display: flex; gap: 4px; }
        .emoji-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.2s; }
        .emoji-btn:active { background: var(--surface-light); }

        /* Bottom Controls (Grid, Shutter, Share) */
        .bottom-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 20px; }
        .control-icon { width: 44px; height: 44px; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; cursor: pointer; opacity: 0.8; transition: opacity 0.2s; }
        .control-icon:active { opacity: 0.4; }
        .grid-dot { width: 8px; height: 8px; background-color: white; border-radius: 2px; }
        
        .shutter-btn { width: 72px; height: 72px; border-radius: 36px; border: 5px solid var(--accent); background: transparent; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .shutter-btn:active { transform: scale(0.9); }
        
        .share-icon { width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; cursor: pointer; opacity: 0.8; }
        .share-icon:active { opacity: 0.4; }

        #hidden-file-input { display: none; }

        /* --- SCREEN LỊCH SỬ (CHAT/FRIENDS STYLE) --- */
        .history-screen { position: absolute; top: 0; left: 100vw; width: 100vw; height: 100vh; background: var(--bg); padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); z-index: 20; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .history-screen.active { transform: translateX(-100vw); }
        
        .history-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .back-btn { font-size: 24px; color: white; cursor: pointer; padding: 8px; }
        .history-title { font-size: 18px; font-weight: 700; flex: 1; text-align: center; margin-right: 40px; }

        .search-bar { background: var(--surface); border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
        .search-bar input { background: transparent; border: none; color: white; font-size: 15px; width: 100%; outline: none; }

        .tx-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
        .tx-item { display: flex; align-items: center; justify-content: space-between; }
        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-avatar { width: 44px; height: 44px; border-radius: 50%; background-color: var(--surface-light); background-size: cover; background-position: center; border: 2px solid var(--accent); display: flex; justify-content: center; align-items: center; font-size: 20px;}
        .tx-info { display: flex; flex-direction: column; }
        .tx-name { font-size: 16px; font-weight: 600; }
        .tx-time { font-size: 13px; color: var(--text-dim); }
        .tx-amount { font-size: 16px; font-weight: 700; color: white; }
        .tx-amount.income { color: var(--success); }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHÍNH (FEED / CAMERA) -->
    <div class="main-screen" id="main-screen">
        <!-- Header -->
        <div class="header">
            <div class="avatar"></div>
            <div class="balance-pill" onclick="promptIncome()">
                <span id="ui-available">0đ</span>
            </div>
            <div class="icon-btn" onclick="alert('Tính năng Thống kê đang phát triển!')">📊</div>
        </div>

        <!-- Khung ảnh Squircle Khổng lồ -->
        <div class="photo-container" id="main-photo" onclick="document.getElementById('hidden-file-input').click()">
            <div class="photo-placeholder" id="photo-placeholder">
                <span style="font-size: 40px;">📷</span>
                <span>Chạm để chụp ảnh</span>
            </div>
            <div class="photo-overlay-text" id="photo-text"></div>
        </div>
        <input type="file" id="hidden-file-input" accept="image/*" capture="environment" onchange="handlePhotoCapture(event)">

        <!-- Thanh nhập tiền phong cách Send Message -->
        <div class="input-bar-container">
            <div class="input-bar">
                <input type="text" id="amount-input" class="input-field" placeholder="Gõ 35k cơm gà..." autocomplete="off">
                <div class="quick-emojis">
                    <button class="emoji-btn" onclick="quickAddCategory('🍜')">🍜</button>
                    <button class="emoji-btn" onclick="quickAddCategory('🧋')">🧋</button>
                    <button class="emoji-btn" onclick="saveTransaction()" style="color: var(--accent); font-weight: bold; font-size: 24px;">↑</button>
                </div>
            </div>
            <div style="font-size: 12px; color: var(--text-dim); text-align: center;" id="smart-hint">Sẵn sàng ghi nhận.</div>
        </div>

        <!-- Cụm phím điều hướng đáy -->
        <div class="bottom-controls">
            <!-- Nút History dạng lưới 4 chấm -->
            <div class="control-icon" style="width: 24px; gap: 2px;" onclick="toggleHistory(true)">
                <div class="grid-dot"></div><div class="grid-dot"></div>
                <div class="grid-dot"></div><div class="grid-dot"></div>
            </div>
            
            <!-- Nút Shutter tròn rỗng -->
            <div class="shutter-btn" onclick="document.getElementById('hidden-file-input').click()"></div>
            
            <!-- Nút Action phụ -->
            <div class="share-icon" onclick="alert('Đã lưu ảnh xuống máy!')">⎋</div>
        </div>
    </div>

    <!-- MÀN HÌNH LỊCH SỬ CHI TIÊU -->
    <div class="history-screen" id="history-screen">
        <div class="history-header">
            <div class="back-btn" onclick="toggleHistory(false)">❮</div>
            <div class="history-title">Giao dịch của bạn</div>
            <div style="width: 24px;"></div> <!-- Cân bằng layout -->
        </div>

        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Tìm kiếm giao dịch...">
        </div>

        <div class="tx-list" id="ui-tx-list">
            <!-- Render bằng JS -->
        </div>
    </div>

<script>
    // --- LƯU TRỮ ---
    let data = JSON.parse(localStorage.getItem('locket_finance_v5'));
    if (!data) {
        data = { baseIncome: 0, transactions: [] };
        localStorage.setItem('locket_finance_v5', JSON.stringify(data));
    }

    let tempPhotoBase64 = null;

    // --- TÍNH TOÁN & HIỂN THỊ ---
    function formatMoney(num) { return num.toLocaleString('vi-VN') + 'đ'; }

    function calculateFinance() {
        let available = data.baseIncome;
        data.transactions.forEach(tx => {
            if (tx.type === 'income') available += tx.amount;
            else available -= tx.amount;
        });
        return available;
    }

    function updateUI() {
        // Cập nhật số dư trên Pill
        document.getElementById('ui-available').innerText = formatMoney(calculateFinance());
        
        // Cập nhật ảnh chính (Lấy giao dịch có ảnh gần nhất)
        const photoTxs = data.transactions.filter(t => t.photo).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        const photoContainer = document.getElementById('main-photo');
        const placeholder = document.getElementById('photo-placeholder');
        const textOverlay = document.getElementById('photo-text');

        if (tempPhotoBase64) {
            // Đang chụp ảnh mới
            photoContainer.style.backgroundImage = `url('${tempPhotoBase64}')`;
            placeholder.style.display = 'none';
            textOverlay.innerText = '';
        } else if (photoTxs.length > 0) {
            // Hiển thị ảnh cũ
            const latest = photoTxs[0];
            photoContainer.style.backgroundImage = `url('${latest.photo}')`;
            placeholder.style.display = 'none';
            textOverlay.innerText = `${latest.note || 'Chi tiêu'} - ${formatMoney(latest.amount)}`;
        } else {
            // Trống
            photoContainer.style.backgroundImage = 'none';
            placeholder.style.display = 'flex';
            textOverlay.innerText = '';
        }

        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('ui-tx-list');
        list.innerHTML = '';
        const txs = [...data.transactions].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        txs.forEach(tx => {
            const isInc = tx.type === 'income';
            const timeStr = new Date(tx.createdAt).toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit'}) + ' · ' + new Date(tx.createdAt).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
            
            let avatarHtml = `<div class="tx-avatar">${isInc ? '💰' : '💸'}</div>`;
            if (tx.photo) {
                avatarHtml = `<div class="tx-avatar" style="background-image: url('${tx.photo}'); border-color: transparent;"></div>`;
            }

            list.innerHTML += `
                <div class="tx-item">
                    <div class="tx-left">
                        ${avatarHtml}
                        <div class="tx-info">
                            <span class="tx-name">${tx.note || 'Không ghi chú'}</span>
                            <span class="tx-time">${timeStr}</span>
                        </div>
                    </div>
                    <span class="tx-amount ${isInc ? 'income' : ''}">${isInc ? '+' : '-'}${formatMoney(tx.amount)}</span>
                </div>
            `;
        });
    }

    // --- NAVIGATION ---
    function toggleHistory(show) {
        if(show) {
            document.getElementById('main-screen').classList.add('slide-left');
            document.getElementById('history-screen').classList.add('active');
        } else {
            document.getElementById('main-screen').classList.remove('slide-left');
            document.getElementById('history-screen').classList.remove('active');
        }
    }

    function promptIncome() {
        let input = prompt("Nhập số dư hiện tại của bạn:", data.baseIncome);
        if (input && !isNaN(input)) {
            data.baseIncome = parseInt(input);
            localStorage.setItem('locket_finance_v5', JSON.stringify(data));
            updateUI();
        }
    }

    // --- XỬ LÝ ẢNH & NHẬP LIỆU ---
    function handlePhotoCapture(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxSize = 600; 
                let w = img.width, h = img.height;
                if(w > h) { if(w > maxSize) { h *= maxSize/w; w = maxSize; } } 
                else { if(h > maxSize) { w *= maxSize/h; h = maxSize; } }
                
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                updateUI();
                document.getElementById('amount-input').focus();
            }
            img.src = evt.target.result;
        }
        reader.readAsDataURL(file);
    }

    const inputField = document.getElementById('amount-input');
    const hintText = document.getElementById('smart-hint');

    inputField.addEventListener('input', function() {
        const val = this.value.trim();
        if(!val) { hintText.innerText = "Sẵn sàng ghi nhận."; return; }
        
        const match = val.match(/^(\d+[\.,]?\d*)([kKmM]?)\s*(.*)$/);
        if(match) {
            let num = parseFloat(match[1].replace(/,/g, '.'));
            let unit = match[2].toLowerCase();
            if(unit === 'k') num *= 1000; else if(unit === 'm') num *= 1000000; else if(num < 1000 && num > 0) num *= 1000;
            hintText.innerHTML = `Sẽ lưu: <b>${formatMoney(num)}</b> - ${match[3] || 'Chi tiêu'}`;
        } else {
            hintText.innerText = "Chưa nhận diện được số tiền.";
        }
    });

    function quickAddCategory(emoji) {
        inputField.value += ' ' + emoji;
        inputField.focus();
        inputField.dispatchEvent(new Event('input'));
    }

    function saveTransaction() {
        const val = inputField.value.trim();
        const match = val.match(/^(\d+[\.,]?\d*)([kKmM]?)\s*(.*)$/);
        if(!match) { alert("Vui lòng gõ số tiền trước! (VD: 35k cơm)"); return; }

        let num = parseFloat(match[1].replace(/,/g, '.'));
        let unit = match[2].toLowerCase();
        let note = match[3].trim();
        if(unit === 'k') num *= 1000; else if(unit === 'm') num *= 1000000; else if(num < 1000 && num > 0) num *= 1000;

        let type = note.toLowerCase().includes('lương') ? 'income' : 'expense';

        data.transactions.push({
            id: Date.now().toString(), type: type, amount: num, note: note,
            photo: tempPhotoBase64, createdAt: new Date().toISOString()
        });
        
        localStorage.setItem('locket_finance_v5', JSON.stringify(data));
        
        // Reset
        inputField.value = '';
        tempPhotoBase64 = null;
        hintText.innerText = "Đã lưu thành công!";
        setTimeout(() => hintText.innerText = "Sẵn sàng ghi nhận.", 2000);
        updateUI();
    }

    // Trigger save on Enter key
    inputField.addEventListener('keypress', function(e) {
        if(e.key === 'Enter') saveTransaction();
    });

    // Init
    updateUI();
</script>
</body>
</html>
