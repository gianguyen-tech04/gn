<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocketMoney - Lịch & Ghi nhận</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --primary: #ff2a5f;
            --primary-gradient: linear-gradient(135deg, #ff2a5f, #ff7e40);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --squircle-radius: 36px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Bố cục chia 2 cột */
        .layout-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            align-items: flex-start;
        }

        .col-left, .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        /* --- CỘT TRÁI: LỊCH --- */
        .calendar-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 18px;
        }
        .calendar-btn {
            background: #333;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }
        .day-name {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 5px;
        }
        .day-cell {
            padding: 8px 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .day-cell:hover { background-color: #333; }
        .day-cell.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 42, 95, 0.4);
        }
        
        /* Cột Lịch Sử */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            display: flex; align-items: center; justify-content: space-between;
            background-color: var(--card-bg); padding: 12px; border-radius: 16px;
        }
        .history-info { display: flex; align-items: center; gap: 12px; }
        .history-thumb {
            width: 45px; height: 45px; border-radius: 12px;
            background-size: cover; background-position: center; background-color: #333;
        }
        .history-cat { font-size: 14px; font-weight: 700; }
        .history-date { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .history-amount { font-size: 15px; font-weight: 800; color: var(--primary); }

        /* --- CỘT PHẢI: LOCKET GHI NHẬN --- */
        .locket-card {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--card-bg);
            border-radius: var(--squircle-radius);
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            position: relative; overflow: hidden;
            border: 2px dashed #444;
            background-size: cover; background-position: center;
            cursor: pointer; transition: transform 0.2s;
        }
        .locket-card:active { transform: scale(0.97); }
        .locket-placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-muted); }
        .locket-placeholder svg { width: 40px; height: 40px; fill: var(--text-muted); }
        #photo-input { display: none; }

        /* Khung nhập số tiền tùy ý */
        .input-group {
            position: relative;
            width: 100%;
        }
        .amount-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 2px solid transparent;
            color: var(--text-main);
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            padding: 15px;
            border-radius: 20px;
            outline: none;
            transition: all 0.2s;
        }
        .amount-input:focus { border-color: var(--primary); }
        .amount-input::placeholder { color: #555; }

        /* Nút tính nhanh & Danh mục */
        .quick-add { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .btn-chip, .cat-btn {
            background-color: var(--card-bg); color: var(--text-muted);
            border: 2px solid transparent; padding: 10px 14px;
            border-radius: 16px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-chip { background-color: #333; color: white; border: none; }
        .btn-chip:active { transform: scale(0.95); }
        
        .cat-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background-color: rgba(255, 42, 95, 0.1);
        }

        /* Nút Ghi nhận */
        .submit-btn {
            background: var(--primary-gradient); color: white; border: none;
            width: 100%; padding: 18px; border-radius: 24px;
            font-size: 18px; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 42, 95, 0.3); transition: transform 0.2s;
        }
        .submit-btn:active { transform: scale(0.95); }

        /* Responsive cho điện thoại (xếp chồng lên nhau) */
        @media (max-width: 768px) {
            .layout-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    
    <!-- CỘT 1: LỊCH & LỊCH SỬ -->
    <div class="col-left">
        <div class="calendar-card">
            <div class="calendar-header">
                <button class="calendar-btn" onclick="changeMonth(-1)">❮</button>
                <span id="month-year-display">Tháng 9, 2026</span>
                <button class="calendar-btn" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- Javascript sẽ tự tạo lịch vào đây -->
            </div>
        </div>

        <h3 style="font-size: 16px; color: var(--text-muted); margin-top: 10px;">Lịch sử ghi nhận</h3>
        <div class="history-list" id="history-box"></div>
    </div>

    <!-- CỘT 2: LOCKET & NHẬP TIỀN -->
    <div class="col-right">
        
        <!-- Vùng up ảnh Locket -->
        <div class="locket-card" id="image-box" onclick="document.getElementById('photo-input').click()">
            <div class="locket-placeholder" id="placeholder">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h1.5l1.2-1.5h2.6l1.2 1.5H16c1.1 0 2 .9 2 2v5c0 1.1-.9 2-2 2z" opacity=".3"/><path d="M4 12c0 4.41 3.59 8 8 8s8-3.59 8-8-3.59-8-8-8-8 3.59-8 8zm12.5 4H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h1.5l1.2-1.5h2.6l1.2 1.5H16c1.1 0 2 .9 2 2v5c0 1.1-.9 2-2 2zM12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span style="font-weight: 600;">Chạm để chụp ảnh</span>
            </div>
        </div>
        <input type="file" id="photo-input" accept="image/*" capture="environment">

        <!-- Nhập số tiền tùy ý -->
        <div class="input-group">
            <input type="number" id="custom-amount" class="amount-input" placeholder="Nhập số tiền (đ)...">
        </div>

        <!-- Phím bấm nhanh cộng dồn -->
        <div class="quick-add">
            <button class="btn-chip" onclick="addMoney(15000)">+15k</button>
            <button class="btn-chip" onclick="addMoney(35000)">+35k</button>
            <button class="btn-chip" onclick="addMoney(50000)">+50k</button>
            <button class="btn-chip" onclick="resetMoney()" style="background-color: #555;">Xóa</button>
        </div>

        <!-- Danh mục -->
        <div class="quick-add" id="category-list">
            <button class="cat-btn active" onclick="selectCat(this, 'Cà phê')">☕ Cà phê</button>
            <button class="cat-btn" onclick="selectCat(this, 'Bánh mì')">🥖 Bánh mì</button>
            <button class="cat-btn" onclick="selectCat(this, 'Phở/Bún')">🍜 Phở/Bún</button>
            <button class="cat-btn" onclick="selectCat(this, 'Ăn vặt')">🍟 Ăn vặt</button>
        </div>

        <!-- Nút Ghi nhận -->
        <button class="submit-btn" onclick="submitRecord()">Ghi nhận ngay 🚀</button>

    </div>

</div>

<script>
    let selectedCat = 'Cà phê';
    let currentImage = '';
    
    // --- XỬ LÝ LỊCH ---
    let currentDate = new Date();
    let selectedDate = new Date(); // Ngày đang được chọn để ghi nhận

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = ''; // Xóa lịch cũ
        
        const month = currentDate.getMonth();
        const year = currentDate.getFullYear();
        document.getElementById('month-year-display').innerText = `Tháng ${month + 1}, ${year}`;

        // Header các ngày trong tuần
        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        days.forEach(d => {
            let el = document.createElement('div');
            el.className = 'day-name';
            el.innerText = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Ô trống đầu tháng
        for(let i = 0; i < firstDay; i++) {
            let empty = document.createElement('div');
            grid.appendChild(empty);
        }

        // Tạo các ngày
        for(let i = 1; i <= daysInMonth; i++) {
            let cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.innerText = i;
            
            // Highlight ngày được chọn
            if (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
                cell.classList.add('active');
            }

            // Click để đổi ngày ghi nhận
            cell.onclick = () => {
                selectedDate = new Date(year, month, i);
                renderCalendar();
            };
            grid.appendChild(cell);
        }
    }

    function changeMonth(step) {
        currentDate.setMonth(currentDate.getMonth() + step);
        renderCalendar();
    }
    
    // Khởi tạo lịch lúc mở app
    renderCalendar();

    // --- XỬ LÝ ẢNH & TIỀN ---
    document.getElementById('photo-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImage = event.target.result;
                const box = document.getElementById('image-box');
                box.style.backgroundImage = `url(${currentImage})`;
                box.style.border = 'none';
                document.getElementById('placeholder').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    });

    const amountInput = document.getElementById('custom-amount');

    function addMoney(amount) {
        let currentVal = parseInt(amountInput.value) || 0;
        amountInput.value = currentVal + amount;
        playPopSound();
    }

    function resetMoney() {
        amountInput.value = '';
    }

    function selectCat(element, catName) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedCat = catName;
    }

    function playPopSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } catch (e) {}
    }

    function submitRecord() {
        let amount = parseInt(amountInput.value);
        if (!amount || amount <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }

        // Định dạng ngày hiển thị (VD: 18/09/2026)
        let dateStr = selectedDate.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });

        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ff2a5f', '#ff7e40', '#ffffff'] });
        playPopSound();

        // Thêm vào UI lịch sử
        const historyBox = document.getElementById('history-box');
        const item = document.createElement('div');
        item.className = 'history-item';
        
        const imgStyle = currentImage ? `background-image: url(${currentImage});` : '';
        
        item.innerHTML = `
            <div class="history-info">
                <div class="history-thumb" style="${imgStyle}"></div>
                <div>
                    <div class="history-cat">${selectedCat}</div>
                    <div class="history-date">Ghi cho ngày: ${dateStr}</div>
                </div>
            </div>
            <div class="history-amount">-${amount.toLocaleString('vi-VN')} đ</div>
        `;
        historyBox.prepend(item);

        // Reset form nhưng giữ nguyên ngày trên lịch
        resetMoney();
        currentImage = '';
        const box = document.getElementById('image-box');
        box.style.backgroundImage = 'none';
        box.style.border = '2px dashed #444';
        document.getElementById('placeholder').style.display = 'flex';
    }
</script>
</body>
</html>
