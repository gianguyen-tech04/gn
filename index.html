<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocketMoney - Widget</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #ffb703; /* Màu vàng Locket */
            --accent-gradient: linear-gradient(135deg, #ffb703, #fb8500);
            --success: #32d74b;
            --warning: #ff9f0a;
            --danger: #ff453a;
            --squircle: 32px;
            --spacing: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding: var(--spacing); padding-bottom: 100px; display: flex; flex-direction: column; gap: var(--spacing); min-height: 100vh; }

        /* WIDGET DESIGN SYSTEM */
        .widget { background-color: var(--card-bg); border-radius: var(--squircle); padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
        
        .widget-title { font-size: 14px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .widget-value { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
        .widget-sub { font-size: 15px; font-weight: 500; color: var(--text-muted); }
        
        /* Progress Bar */
        .progress-track { width: 100%; height: 8px; background-color: #333; border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; background: var(--accent-gradient); border-radius: 4px; transition: width 0.3s ease; }
        .progress-fill.danger { background: var(--danger); }
        
        /* Flex Utils */
        .row-between { display: flex; justify-content: space-between; align-items: center; }
        .col-gap { display: flex; flex-direction: column; gap: 4px; }

        /* WIDGET CHÍNH: CÒN LẠI */
        .w-main .widget-value { color: var(--accent); font-size: 36px; }
        
        /* WIDGET: CHI TIÊU GẦN ĐÂY */
        .tx-list { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
        .tx-item { display: flex; align-items: center; justify-content: space-between; }
        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-icon { width: 40px; height: 40px; border-radius: 14px; background-color: #333; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .tx-name { font-size: 16px; font-weight: 600; }
        .tx-time { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .tx-amount { font-size: 16px; font-weight: 700; }
        .tx-amount.income { color: var(--success); }

        /* FAB QUICK ADD */
        .fab { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 32px; background: var(--accent-gradient); color: #000; border: none; font-size: 32px; font-weight: 400; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 25px rgba(255, 183, 3, 0.4); cursor: pointer; transition: transform 0.2s; z-index: 100; }
        .fab:active { transform: translateX(-50%) scale(0.9); }

        /* BOTTOM SHEET QUICK ADD */
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 200; }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background-color: var(--card-bg); border-radius: 32px 32px 0 0; padding: 24px; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 201; display: flex; flex-direction: column; gap: 20px; }
        .bottom-sheet.active { bottom: 0; }
        
        .bs-drag { width: 40px; height: 5px; background: #555; border-radius: 3px; margin: 0 auto 10px; }
        
        /* Tabs */
        .tabs { display: flex; background: #000; border-radius: 20px; padding: 4px; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; color: var(--text-muted); border-radius: 16px; transition: 0.2s; }
        .tab.active { background: #333; color: #fff; }
        
        /* Smart Input */
        .smart-input-wrapper { background: #000; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #333; }
        .smart-input { background: transparent; border: none; color: #fff; font-size: 24px; font-weight: 700; width: 100%; outline: none; }
        .smart-input::placeholder { color: #555; font-weight: 600; }
        .smart-hint { font-size: 13px; color: var(--text-muted); }

        .btn-save { background: var(--accent-gradient); color: #000; border: none; padding: 18px; border-radius: 24px; font-size: 18px; font-weight: 700; width: 100%; cursor: pointer; transition: transform 0.2s; }
        .btn-save:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <!-- 1. WIDGET CÒN LẠI (MAIN) -->
    <div class="widget w-main" id="w-main" onclick="promptIncome()">
        <div class="widget-title">💰 CÒN LẠI</div>
        <div class="widget-value" id="ui-available">0đ</div>
        <div class="row-between">
            <div class="widget-sub" id="ui-daily-allowance">Hôm nay: 0đ / ngày</div>
            <div class="widget-sub" style="font-size: 13px;">Tài sản: <span id="ui-total-assets">0đ</span></div>
        </div>
    </div>

    <!-- 2. WIDGET HÔM NAY -->
    <div class="widget">
        <div class="widget-title">☀️ HÔM NAY</div>
        <div class="row-between">
            <div class="col-gap">
                <span style="font-size: 13px; color: var(--text-muted);">Ngân sách</span>
                <span style="font-weight: 600;" id="ui-today-budget">0đ</span>
            </div>
            <div class="col-gap" style="text-align: center;">
                <span style="font-size: 13px; color: var(--text-muted);">Đã tiêu</span>
                <span style="font-weight: 600;" id="ui-today-spent">0đ</span>
            </div>
            <div class="col-gap" style="text-align: right;">
                <span style="font-size: 13px; color: var(--text-muted);" id="ui-today-status-label">Còn</span>
                <span style="font-weight: 600;" id="ui-today-remain">0đ</span>
            </div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="ui-today-progress" style="width: 0%;"></div>
        </div>
    </div>

    <!-- 3. WIDGET QUỸ -->
    <div class="widget">
        <div class="widget-title">🎯 TIỀN TRONG QUỸ</div>
        <div class="row-between">
            <div class="widget-value" style="font-size: 24px;" id="ui-fund-balance">0đ</div>
        </div>
        <div class="widget-sub" style="font-size: 13px;">Được tách riêng, không tính vào tiền khả dụng.</div>
    </div>

    <!-- 4. WIDGET CHI TIÊU GẦN ĐÂY -->
    <div class="widget">
        <div class="widget-title">GIAO DỊCH GẦN ĐÂY</div>
        <div class="tx-list" id="ui-tx-list">
            <!-- Render JS -->
        </div>
    </div>

    <!-- FAB & BOTTOM SHEET -->
    <button class="fab" onclick="toggleSheet(true)">+</button>

    <div class="overlay" id="overlay" onclick="toggleSheet(false)"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="bs-drag"></div>
        <div class="tabs" id="tx-tabs">
            <div class="tab active" onclick="switchTab('expense')">💸 Chi tiêu</div>
            <div class="tab" onclick="switchTab('income')">💰 Thu nhập</div>
            <div class="tab" onclick="switchTab('fund_deposit')">🎯 Nạp quỹ</div>
            <div class="tab" onclick="switchTab('fund_withdraw')">↩️ Rút quỹ</div>
        </div>
        
        <div class="smart-input-wrapper">
            <input type="text" id="smart-input" class="smart-input" placeholder="Ví dụ: 35k cơm" autocomplete="off" oninput="parseSmartInput()">
            <div class="smart-hint" id="smart-hint">Gõ số tiền và ghi chú...</div>
        </div>

        <button class="btn-save" onclick="saveTransaction()">Lưu giao dịch</button>
    </div>

<script>
    // --- 20. DATA MODEL & STORAGE ---
    let data = JSON.parse(localStorage.getItem('lm_data_v2'));
    
    // Khởi tạo hoặc Migration từ bản cũ nếu chưa có v2
    if (!data) {
        let oldBalance = parseInt(localStorage.getItem('lm_balance')) || 0;
        data = {
            baseIncome: oldBalance, // Số tiền khởi điểm
            transactions: [],
            funds: [{ id: 'f1', name: 'Quỹ chung', target: 0, balance: 0 }]
        };
        localStorage.setItem('lm_data_v2', JSON.stringify(data));
    }

    // Biến trạng thái UI
    let currentTxType = 'expense';
    let parsedAmount = 0;
    let parsedNote = '';

    // --- 18. LOGIC NGÀY THÁNG ---
    function getDaysLeftInMonth() {
        const today = new Date();
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        // +1 để bao gồm cả ngày hôm nay
        return lastDay.getDate() - today.getDate() + 1; 
    }

    function isToday(dateString) {
        const d = new Date(dateString);
        const today = new Date();
        return d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
    }

    function isThisMonth(dateString) {
        const d = new Date(dateString);
        const today = new Date();
        return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
    }

    // --- 8. & 21. TÍNH TOÁN TIỀN CHUẨN XÁC ---
    function calculateFinance() {
        let income = data.baseIncome;
        let expense = 0;
        let fundDeposit = 0;
        let fundWithdraw = 0;
        let todaySpent = 0;

        data.transactions.forEach(tx => {
            if (tx.type === 'income') income += tx.amount;
            if (tx.type === 'expense') {
                expense += tx.amount;
                if (isToday(tx.createdAt)) todaySpent += tx.amount;
            }
            if (tx.type === 'fund_deposit') fundDeposit += tx.amount;
            if (tx.type === 'fund_withdraw') fundWithdraw += tx.amount;
        });

        // Tiền khả dụng = Thu nhập ban đầu + Thu nhập thêm - Chi tiêu - Nạp quỹ + Rút quỹ
        const available = income - expense - fundDeposit + fundWithdraw;
        
        // Cập nhật số dư thực tế trong quỹ
        const fundBalance = fundDeposit - fundWithdraw;
        if(data.funds[0]) data.funds[0].balance = fundBalance;

        // Tổng tài sản = Khả dụng + Tiền trong quỹ
        const totalAssets = available + fundBalance;

        return { available, totalAssets, fundBalance, todaySpent };
    }

    // --- RENDER GIAO DIỆN ---
    function formatMoney(num) {
        return num.toLocaleString('vi-VN') + 'đ';
    }

    function updateDashboard() {
        const calc = calculateFinance();
        const daysLeft = getDaysLeftInMonth();
        
        // 7. Tính tiền mỗi ngày
        // Cần đảm bảo tiền khả dụng > 0 để tính, nếu âm thì mỗi ngày = 0
        const dailyAllowance = calc.available > 0 ? Math.floor(calc.available / daysLeft) : 0;

        // Cập nhật Widget 1
        document.getElementById('ui-available').innerText = formatMoney(calc.available);
        document.getElementById('ui-total-assets').innerText = formatMoney(calc.totalAssets);
        document.getElementById('ui-daily-allowance').innerText = `Hôm nay: ${formatMoney(dailyAllowance)} / ngày`;

        // Cập nhật Widget 2 (Hôm nay)
        document.getElementById('ui-today-budget').innerText = formatMoney(dailyAllowance);
        document.getElementById('ui-today-spent').innerText = formatMoney(calc.todaySpent);
        
        const todayRemain = dailyAllowance - calc.todaySpent;
        const progressFill = document.getElementById('ui-today-progress');
        const statusLabel = document.getElementById('ui-today-status-label');
        
        if (todayRemain >= 0) {
            statusLabel.innerText = "Còn";
            document.getElementById('ui-today-remain').innerText = formatMoney(todayRemain);
            let pct = dailyAllowance > 0 ? (calc.todaySpent / dailyAllowance) * 100 : 0;
            progressFill.style.width = Math.min(pct, 100) + '%';
            progressFill.classList.remove('danger');
        } else {
            statusLabel.innerText = "⚠️ Vượt";
            document.getElementById('ui-today-remain').innerText = formatMoney(Math.abs(todayRemain));
            progressFill.style.width = '100%';
            progressFill.classList.add('danger');
        }

        // Cập nhật Widget 3 (Quỹ)
        document.getElementById('ui-fund-balance').innerText = formatMoney(calc.fundBalance);

        // Cập nhật Widget 4 (List)
        renderRecentTransactions();
    }

    function getCategoryIcon(note, type) {
        if (type === 'income') return '💰';
        if (type === 'fund_deposit') return '🎯';
        if (type === 'fund_withdraw') return '↩️';
        
        const n = note.toLowerCase();
        if (n.includes('cơm') || n.includes('phở') || n.includes('ăn')) return '🍜';
        if (n.includes('nước') || n.includes('trà sữa') || n.includes('cafe')) return '🧋';
        if (n.includes('xăng') || n.includes('xe')) return '⛽';
        if (n.includes('game') || n.includes('nạp')) return '🎮';
        return '💸';
    }

    function renderRecentTransactions() {
        const list = document.getElementById('ui-tx-list');
        list.innerHTML = '';
        
        // Lấy 5 giao dịch gần nhất
        const recent = [...data.transactions].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
        
        if(recent.length === 0) {
            list.innerHTML = '<div style="color:var(--text-muted); font-size: 14px;">Chưa có giao dịch nào.</div>';
            return;
        }

        recent.forEach(tx => {
            const timeStr = new Date(tx.createdAt).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            const isPlus = (tx.type === 'income' || tx.type === 'fund_withdraw');
            
            const item = document.createElement('div');
            item.className = 'tx-item';
            item.innerHTML = `
                <div class="tx-left">
                    <div class="tx-icon">${getCategoryIcon(tx.note, tx.type)}</div>
                    <div>
                        <div class="tx-name">${tx.note || 'Không ghi chú'}</div>
                        <div class="tx-time">${timeStr}</div>
                    </div>
                </div>
                <div class="tx-amount ${isPlus ? 'income' : ''}">${isPlus ? '+' : '-'}${formatMoney(tx.amount)}</div>
            `;
            list.appendChild(item);
        });
    }

    // --- QUICK ADD & SMART INPUT ---
    function toggleSheet(show) {
        document.getElementById('overlay').classList.toggle('active', show);
        document.getElementById('bottom-sheet').classList.toggle('active', show);
        if(show) {
            document.getElementById('smart-input').focus();
        }
    }

    function switchTab(type) {
        currentTxType = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        parseSmartInput(); // Cập nhật lại hint
    }

    // 9. Smart Parsing: Tách số và chữ (VD: "35k cơm" -> 35000, "cơm")
    function parseSmartInput() {
        const val = document.getElementById('smart-input').value.trim();
        const hint = document.getElementById('smart-hint');
        
        if (!val) {
            parsedAmount = 0; parsedNote = '';
            hint.innerText = "Gõ số tiền và ghi chú...";
            return;
        }

        // Regex tìm số ở đầu (hỗ trợ chữ k, củ, m)
        const regex = /^(\d+[\.,]?\d*)([kKmM]?)\s*(.*)$/;
        const match = val.match(regex);

        if (match) {
            let numStr = match[1].replace(/,/g, '.');
            let num = parseFloat(numStr);
            let unit = match[2].toLowerCase();
            parsedNote = match[3].trim();

            if (unit === 'k') num *= 1000;
            else if (unit === 'm') num *= 1000000;
            // Mặc định nếu người dùng gõ "35" mà không có k, tự hiểu là 35k cho nhanh gọn theo thói quen Gen Z
            else if (num < 1000 && num > 0) num *= 1000;

            parsedAmount = num;

            let actionText = "Chi tiêu";
            if (currentTxType === 'income') actionText = "Thu nhập";
            if (currentTxType === 'fund_deposit') actionText = "Nạp vào quỹ";
            if (currentTxType === 'fund_withdraw') actionText = "Rút từ quỹ";

            hint.innerHTML = `Sẽ ghi nhận: <b>${formatMoney(parsedAmount)}</b> - ${parsedNote || 'Không ghi chú'} (${actionText})`;
        } else {
            parsedAmount = 0;
            hint.innerText = "Không nhận diện được số tiền.";
        }
    }

    function saveTransaction() {
        if (parsedAmount <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }

        const newTx = {
            id: Date.now().toString(),
            type: currentTxType,
            amount: parsedAmount,
            note: parsedNote || 'Giao dịch',
            createdAt: new Date().toISOString()
        };

        data.transactions.push(newTx);
        localStorage.setItem('lm_data_v2', JSON.stringify(data));
        
        // Reset form
        document.getElementById('smart-input').value = '';
        parseSmartInput();
        toggleSheet(false);
        updateDashboard();
    }

    // Cài đặt số tiền gốc nếu user tap vào widget CÒN LẠI
    function promptIncome() {
        let input = prompt("Thiết lập tiền khả dụng ban đầu (Không tính quỹ):", data.baseIncome);
        if (input !== null && !isNaN(input) && input.trim() !== "") {
            data.baseIncome = parseInt(input);
            localStorage.setItem('lm_data_v2', JSON.stringify(data));
            updateDashboard();
        }
    }

    // Khởi tạo
    updateDashboard();

</script>
</body>
</html>
