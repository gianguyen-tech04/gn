<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LocketMoney - Photo Journal</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #141415;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #ffb703; /* Màu vàng đặc trưng */
            --accent-gradient: linear-gradient(135deg, #ffb703, #fb8500);
            --success: #32d74b;
            --danger: #ff453a;
            --squircle: 28px;
            --spacing: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: var(--spacing); 
            padding-bottom: 120px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            min-height: 100vh; 
        }

        /* --- LIQUID GLASS SYSTEM --- */
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- WIDGETS --- */
        .widget { 
            background-color: var(--card-bg); 
            border-radius: var(--squircle); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            position: relative; 
            overflow: hidden; 
        }
        
        .widget-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .widget-value { font-size: 36px; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
        .widget-sub { font-size: 15px; font-weight: 500; color: var(--text-muted); }
        
        .row-between { display: flex; justify-content: space-between; align-items: center; }
        .col-gap { display: flex; flex-direction: column; gap: 4px; }

        /* Progress Bar */
        .progress-track { width: 100%; height: 8px; background-color: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; background: var(--accent-gradient); border-radius: 4px; transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .progress-fill.danger { background: var(--danger); }

        /* --- PHOTO JOURNAL GRID --- */
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .photo-card {
            aspect-ratio: 1;
            border-radius: 24px;
            background-size: cover;
            background-position: center;
            background-color: #222;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            cursor: pointer;
        }
        .photo-overlay {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .photo-card-icon { font-size: 20px; }
        .photo-card-amount { font-size: 16px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* --- TRANSACTION LIST --- */
        .tx-list { display: flex; flex-direction: column; gap: 16px; margin-top: 4px; }
        .tx-item { display: flex; align-items: center; justify-content: space-between; }
        .tx-left { display: flex; align-items: center; gap: 14px; }
        .tx-icon-wrapper { 
            width: 44px; height: 44px; border-radius: 16px; 
            background-color: #2c2c2e; display: flex; justify-content: center; align-items: center; 
            font-size: 22px; background-size: cover; background-position: center;
        }
        .tx-name { font-size: 16px; font-weight: 600; }
        .tx-time { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .tx-amount { font-size: 16px; font-weight: 700; }
        .tx-amount.income { color: var(--success); }

        /* --- FAB CAMERA (LIQUID GLASS) --- */
        .fab-wrapper { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; pointer-events: none; }
        .fab { 
            width: 72px; height: 72px; border-radius: 36px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 32px; cursor: pointer; pointer-events: all;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fab:active { transform: scale(0.9); }

        /* --- FULLSCREEN PREVIEW & LIQUID GLASS SHEET --- */
        .preview-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #000; background-size: cover; background-position: center;
            z-index: 200; opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .preview-modal.active { opacity: 1; pointer-events: all; }
        
        .preview-top { padding: 50px 20px 20px; display: flex; justify-content: flex-end; }
        .btn-close-preview { width: 40px; height: 40px; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: white; border: none; cursor: pointer; }
        
        .glass-sheet {
            margin: 0 16px 30px; border-radius: 32px; padding: 24px;
            display: flex; flex-direction: column; gap: 20px;
            transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .preview-modal.active .glass-sheet { transform: translateY(0); opacity: 1; }

        /* Smart Input inside Glass */
        .smart-input-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .smart-input { background: transparent; border: none; color: #fff; font-size: 32px; font-weight: 800; width: 100%; outline: none; text-align: center; }
        .smart-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 700; }
        .smart-hint { font-size: 14px; color: rgba(255,255,255,0.8); text-align: center; font-weight: 500; }

        .btn-save { background: var(--accent-gradient); color: #000; border: none; padding: 18px; border-radius: 24px; font-size: 18px; font-weight: 700; width: 100%; cursor: pointer; transition: transform 0.2s; box-shadow: 0 10px 20px rgba(255, 183, 3, 0.3); }
        .btn-save:active { transform: scale(0.95); }
        
        #hidden-camera-input { display: none; }
    </style>
</head>
<body>

    <!-- WIDGET 1: CÒN LẠI -->
    <div class="widget w-main" onclick="promptIncome()">
        <div class="widget-title">💰 Khả dụng</div>
        <div class="widget-value" id="ui-available">0đ</div>
        <div class="row-between">
            <div class="widget-sub" id="ui-daily-allowance">0đ / ngày</div>
            <div class="widget-sub" style="font-size: 13px;">Tài sản: <span id="ui-total-assets">0đ</span></div>
        </div>
    </div>

    <!-- WIDGET 2: HÔM NAY -->
    <div class="widget">
        <div class="widget-title">☀️ Hôm nay</div>
        <div class="row-between">
            <div class="col-gap">
                <span style="font-size: 12px; color: var(--text-muted);">Ngân sách</span>
                <span style="font-weight: 600;" id="ui-today-budget">0đ</span>
            </div>
            <div class="col-gap" style="text-align: center;">
                <span style="font-size: 12px; color: var(--text-muted);">Đã tiêu</span>
                <span style="font-weight: 600;" id="ui-today-spent">0đ</span>
            </div>
            <div class="col-gap" style="text-align: right;">
                <span style="font-size: 12px; color: var(--text-muted);" id="ui-today-status-label">Còn</span>
                <span style="font-weight: 600;" id="ui-today-remain">0đ</span>
            </div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="ui-today-progress" style="width: 0%;"></div>
        </div>
    </div>

    <!-- PHOTO JOURNAL (Chỉ hiện khi có ảnh) -->
    <div class="widget" id="journal-widget" style="display: none; background: transparent; padding: 0;">
        <div class="widget-title" style="margin-left: 4px;">📸 Nhật ký bằng ảnh</div>
        <div class="photo-grid" id="ui-photo-grid">
            <!-- Render JS -->
        </div>
    </div>

    <!-- WIDGET 3: GẦN ĐÂY -->
    <div class="widget">
        <div class="widget-title">Giao dịch gần đây</div>
        <div class="tx-list" id="ui-tx-list">
            <!-- Render JS -->
        </div>
    </div>

    <!-- WIDGET 4: QUỸ -->
    <div class="widget">
        <div class="widget-title">🎯 Quỹ của tôi</div>
        <div class="row-between">
            <div class="widget-value" style="font-size: 24px; color: var(--text-main);" id="ui-fund-balance">0đ</div>
        </div>
        <div class="widget-sub" style="font-size: 13px;">Tách biệt hoàn toàn với tiền tiêu dùng.</div>
    </div>

    <!-- FAB CAMERA -->
    <div class="fab-wrapper">
        <div class="fab glass" onclick="openCamera()">📸</div>
    </div>
    <input type="file" id="hidden-camera-input" accept="image/*" capture="environment" onchange="handlePhotoCapture(event)" />

    <!-- PREVIEW & LIQUID GLASS SHEET -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-top">
            <button class="btn-close-preview glass" onclick="closePreview()">✕</button>
        </div>
        
        <div class="glass-sheet glass">
            <div class="smart-input-wrapper">
                <input type="text" id="smart-input" class="smart-input" placeholder="Ví dụ: 35k cơm" autocomplete="off" oninput="parseSmartInput()">
                <div class="smart-hint" id="smart-hint">Gõ số tiền và ghi chú món đồ bạn vừa chụp...</div>
            </div>
            <button class="btn-save" onclick="saveTransaction()">Lưu giao dịch</button>
        </div>
    </div>

<script>
    // --- LƯU TRỮ VÀ DATA MODEL ---
    let data = JSON.parse(localStorage.getItem('lm_data_v3'));
    if (!data) {
        data = {
            baseIncome: 0, 
            transactions: [],
            funds: [{ id: 'f1', name: 'Quỹ chung', target: 0, balance: 0 }]
        };
        localStorage.setItem('lm_data_v3', JSON.stringify(data));
    }

    let tempPhotoBase64 = null;
    let parsedAmount = 0;
    let parsedNote = '';
    let parsedCategory = 'expense';

    // --- LOGIC NGÀY THÁNG & TÍNH TOÁN (CHUẨN XÁC) ---
    function getDaysLeftInMonth() {
        const today = new Date();
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        return lastDay.getDate() - today.getDate() + 1; 
    }

    function isToday(dateString) {
        const d = new Date(dateString);
        const today = new Date();
        return d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
    }

    function calculateFinance() {
        let income = data.baseIncome;
        let expense = 0;
        let fundDeposit = 0;
        let fundWithdraw = 0;
        let todaySpent = 0;

        data.transactions.forEach(tx => {
            if (tx.type === 'income') income += tx.amount;
            if (tx.type === 'expense') {
                expense += tx.amount;
                if (isToday(tx.createdAt)) todaySpent += tx.amount;
            }
            if (tx.type === 'fund_deposit') fundDeposit += tx.amount;
            if (tx.type === 'fund_withdraw') fundWithdraw += tx.amount;
        });

        const available = income - expense - fundDeposit + fundWithdraw;
        const fundBalance = fundDeposit - fundWithdraw;
        const totalAssets = available + fundBalance;

        return { available, totalAssets, fundBalance, todaySpent };
    }

    function formatMoney(num) {
        return num.toLocaleString('vi-VN') + 'đ';
    }

    // --- CẬP NHẬT GIAO DIỆN CHÍNH ---
    function updateDashboard() {
        const calc = calculateFinance();
        const daysLeft = getDaysLeftInMonth();
        const dailyAllowance = calc.available > 0 ? Math.floor(calc.available / daysLeft) : 0;

        document.getElementById('ui-available').innerText = formatMoney(calc.available);
        document.getElementById('ui-total-assets').innerText = formatMoney(calc.totalAssets);
        document.getElementById('ui-daily-allowance').innerText = `✨ Hôm nay m có khoảng ${formatMoney(dailyAllowance)} để tiêu`;

        document.getElementById('ui-today-budget').innerText = formatMoney(dailyAllowance);
        document.getElementById('ui-today-spent').innerText = formatMoney(calc.todaySpent);
        
        const todayRemain = dailyAllowance - calc.todaySpent;
        const progressFill = document.getElementById('ui-today-progress');
        const statusLabel = document.getElementById('ui-today-status-label');
        
        if (todayRemain >= 0) {
            statusLabel.innerText = "Còn";
            document.getElementById('ui-today-remain').innerText = formatMoney(todayRemain);
            let pct = dailyAllowance > 0 ? (calc.todaySpent / dailyAllowance) * 100 : 0;
            progressFill.style.width = Math.min(pct, 100) + '%';
            progressFill.classList.remove('danger');
        } else {
            statusLabel.innerText = "⚠️ Vượt";
            document.getElementById('ui-today-remain').innerText = formatMoney(Math.abs(todayRemain));
            progressFill.style.width = '100%';
            progressFill.classList.add('danger');
        }

        document.getElementById('ui-fund-balance').innerText = formatMoney(calc.fundBalance);

        renderRecentTransactions();
        renderPhotoJournal();
    }

    function getCategoryIcon(note, type) {
        if (type === 'income') return '💰';
        if (type === 'fund_deposit') return '🎯';
        if (type === 'fund_withdraw') return '↩️';
        const n = note.toLowerCase();
        if (n.includes('cơm') || n.includes('phở') || n.includes('ăn')) return '🍜';
        if (n.includes('nước') || n.includes('trà sữa') || n.includes('cafe')) return '🧋';
        if (n.includes('xăng') || n.includes('xe')) return '⛽';
        if (n.includes('áo') || n.includes('mua')) return '🛍️';
        return '💸';
    }

    function renderRecentTransactions() {
        const list = document.getElementById('ui-tx-list');
        list.innerHTML = '';
        const recent = [...data.transactions].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
        
        if(recent.length === 0) {
            list.innerHTML = '<div style="color:var(--text-muted); font-size: 14px;">Chưa có giao dịch nào.</div>';
            return;
        }

        recent.forEach(tx => {
            const timeStr = new Date(tx.createdAt).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            const isPlus = (tx.type === 'income' || tx.type === 'fund_withdraw');
            
            // Xử lý Thumbnail ảnh Liquid style
            let iconHtml = `<div class="tx-icon-wrapper">${getCategoryIcon(tx.note, tx.type)}</div>`;
            if (tx.photo) {
                iconHtml = `<div class="tx-icon-wrapper" style="background-image: url('${tx.photo}'); border: 1px solid rgba(255,255,255,0.2);"></div>`;
            }

            const item = document.createElement('div');
            item.className = 'tx-item';
            item.innerHTML = `
                <div class="tx-left">
                    ${iconHtml}
                    <div>
                        <div class="tx-name">${tx.note || 'Chi tiêu'}</div>
                        <div class="tx-time">${timeStr}</div>
                    </div>
                </div>
                <div class="tx-amount ${isPlus ? 'income' : ''}">${isPlus ? '+' : '-'}${formatMoney(tx.amount)}</div>
            `;
            list.appendChild(item);
        });
    }

    // --- TẠO GRID NHẬT KÝ ẢNH ---
    function renderPhotoJournal() {
        const grid = document.getElementById('ui-photo-grid');
        const widget = document.getElementById('journal-widget');
        grid.innerHTML = '';

        // Lọc các giao dịch có chứa ảnh
        const photos = data.transactions.filter(t => t.photo).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 4);
        
        if (photos.length > 0) {
            widget.style.display = 'flex';
            photos.forEach(tx => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.style.backgroundImage = `url('${tx.photo}')`;
                card.innerHTML = `
                    <div class="photo-overlay">
                        <span class="photo-card-icon">${getCategoryIcon(tx.note, tx.type)}</span>
                        <span class="photo-card-amount">${formatMoney(tx.amount)}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        } else {
            widget.style.display = 'none';
        }
    }


    // --- CAMERA & LIQUID GLASS SHEET ---
    function openCamera() {
        document.getElementById('hidden-camera-input').click();
    }

    function handlePhotoCapture(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            // NÉN ẢNH (Quan trọng để không làm đầy localStorage)
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxSize = 600; 
                let width = img.width; let height = img.height;
                if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6); // Chất lượng 60%

                // Mở Preview Modal
                const modal = document.getElementById('preview-modal');
                modal.style.backgroundImage = `url('${tempPhotoBase64}')`;
                modal.classList.add('active');
                
                // Mở bàn phím ảo
                setTimeout(() => { document.getElementById('smart-input').focus(); }, 300);
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    function closePreview() {
        document.getElementById('preview-modal').classList.remove('active');
        document.getElementById('smart-input').value = '';
        tempPhotoBase64 = null;
        parsedAmount = 0;
        document.getElementById('smart-hint').innerText = "Gõ số tiền và ghi chú món đồ bạn vừa chụp...";
    }

    function parseSmartInput() {
        const val = document.getElementById('smart-input').value.trim();
        const hint = document.getElementById('smart-hint');
        
        if (!val) {
            parsedAmount = 0; parsedNote = '';
            hint.innerText = "Gõ số tiền và ghi chú món đồ bạn vừa chụp...";
            return;
        }

        const regex = /^(\d+[\.,]?\d*)([kKmM]?)\s*(.*)$/;
        const match = val.match(regex);

        if (match) {
            let num = parseFloat(match[1].replace(/,/g, '.'));
            let unit = match[2].toLowerCase();
            parsedNote = match[3].trim();

            if (unit === 'k') num *= 1000;
            else if (unit === 'm') num *= 1000000;
            else if (num < 1000 && num > 0) num *= 1000;

            parsedAmount = num;
            
            // Nếu phát hiện từ khoá thì gán category
            let catName = "Chi tiêu";
            if(parsedNote.toLowerCase().includes('lương')) { parsedCategory = 'income'; catName = "Thu nhập"; }
            else { parsedCategory = 'expense'; }

            hint.innerHTML = `Sẽ ghi nhận: <b>${formatMoney(parsedAmount)}</b> - ${parsedNote || 'Không ghi chú'}`;
        } else {
            parsedAmount = 0;
            hint.innerText = "Không nhận diện được số tiền.";
        }
    }

    function saveTransaction() {
        if (parsedAmount <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }

        const newTx = {
            id: Date.now().toString(),
            type: parsedCategory,
            amount: parsedAmount,
            note: parsedNote || 'Giao dịch',
            photo: tempPhotoBase64,
            createdAt: new Date().toISOString()
        };

        data.transactions.push(newTx);
        localStorage.setItem('lm_data_v3', JSON.stringify(data));
        
        closePreview();
        updateDashboard();
    }

    function promptIncome() {
        let input = prompt("Thiết lập tiền khả dụng ban đầu (Không tính quỹ):", data.baseIncome);
        if (input !== null && !isNaN(input) && input.trim() !== "") {
            data.baseIncome = parseInt(input);
            localStorage.setItem('lm_data_v3', JSON.stringify(data));
            updateDashboard();
        }
    }

    // Khởi tạo
    updateDashboard();

</script>
</body>
</html>
